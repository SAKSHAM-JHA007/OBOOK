<body class="bg-background text-on-surface font-body-md">
<!-- TopNavBar -->
<nav class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md shadow-sm">
<div class="flex justify-between items-center max-w-container-max mx-auto px-margin-mobile md:px-gutter h-20">
<a class="font-headline-md text-headline-md font-bold text-primary tracking-tight" href="index.html">OBOOK</a>
<div class="flex items-center gap-stack-md">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors duration-200 px-4 py-2 rounded-xl" href="index.html">Home</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors duration-200 px-4 py-2 rounded-xl" href="signup.html">Sign Up</a>
</div>
</div>
</nav>

<main class="pt-24 pb-16 min-h-screen flex items-center justify-center">
<div class="max-w-md mx-auto px-margin-mobile w-full">
<!-- Form Card -->
<div class="bg-surface rounded-[32px] p-8 shadow-lg">
<div class="mb-8">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface mb-3">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Log in to your OBOOK account and continue sharing.</p>
</div>

<form id="loginForm" class="space-y-4">
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-2">Email</label>
<input type="email" id="loginEmail" name="email" class="w-full px-4 py-3 rounded-xl border border-outline-variant text-on-surface placeholder-on-surface-variant focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10" placeholder="Enter your email" required/>
</div>

<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-2">Password</label>
<input type="password" id="loginPassword" name="password" class="w-full px-4 py-3 rounded-xl border border-outline-variant text-on-surface placeholder-on-surface-variant focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10" placeholder="Enter your password" required/>
</div>

<div class="flex items-center justify-between">
<label class="flex items-center gap-2 cursor-pointer">
<input type="checkbox" id="rememberMe" class="w-4 h-4 rounded border-outline-variant text-primary"/>
<span class="font-body-md text-body-md text-on-surface-variant">Remember me</span>
</label>
<a href="#" class="font-label-sm text-label-sm text-primary hover:underline">Forgot password?</a>
</div>

<button type="submit" class="w-full bg-primary-container text-on-primary-container font-label-sm text-label-sm px-6 py-3 rounded-xl hover:opacity-90 active:scale-95 transition-all shadow-md mt-6">Log In</button>

<p id="loginError" class="text-error text-sm text-center hidden"></p>
<p class="text-center text-sm text-on-surface-variant">Don't have an account? <a href="signup.html" class="text-primary font-semibold hover:underline">Sign up</a></p>
</form>
</div>
</div>
</main>

<!-- Footer -->
<footer class="w-full border-t border-outline-variant/10 bg-surface mt-16">
<div class="flex flex-col md:flex-row justify-between items-center max-w-container-max mx-auto px-margin-mobile md:px-gutter py-stack-lg gap-stack-md">
<div class="flex flex-col items-center md:items-start gap-2">
<div class="font-headline-md text-headline-md font-bold text-primary opacity-80">OBOOK</div>
<p class="font-label-sm text-label-sm text-on-surface-variant">© 2024 OBOOK. All rights reserved.</p>
</div>
<div class="flex flex-wrap justify-center gap-x-8 gap-y-4">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Help</a>
</div>
</div>
</footer>

<script>
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const loginEmail = document.getElementById('loginEmail');
    const loginPassword = document.getElementById('loginPassword');
    const rememberMe = document.getElementById('rememberMe');

    // Restore email if user had it saved
    const savedEmail = localStorage.getItem('obookSavedEmail');
    if (savedEmail) {
        loginEmail.value = savedEmail;
        rememberMe.checked = true;
    }

    loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        loginError.classList.add('hidden');

        // Save email if remember me is checked
        if (rememberMe.checked) {
            localStorage.setItem('obookSavedEmail', loginEmail.value);
        } else {
            localStorage.removeItem('obookSavedEmail');
        }

        const payload = {
            email: loginEmail.value.trim(),
            password: loginPassword.value
        };

        try {
            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();
            if (!response.ok) {
                loginError.textContent = result.error || 'Invalid email or password';
                loginError.classList.remove('hidden');
                return;
            }

            window.location.href = result.redirect || '/feed.html';
        } catch (error) {
            loginError.textContent = 'Unable to log in right now.';
            loginError.classList.remove('hidden');
        }
    });

    // Button micro-interactions
    document.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('mousedown', () => {
            btn.style.transform = 'scale(0.95)';
        });
        btn.addEventListener('mouseup', () => {
            btn.style.transform = 'scale(1)';
        });
        btn.addEventListener('mouseleave', () => {
            btn.style.transform = 'scale(1)';
        });
    });
</script>
</body>
</html>
