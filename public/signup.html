<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - OBOOK</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login">
    <header class="brand-header">
        <img class="brand-logo" src="logo.svg" alt="OBOOK logo">
        <div>
            <div class="brand-name">OBOOK</div>
            <div class="brand-tag">CONNECT. SHARE. INSPIRE.</div>
        </div>
    </header>

    <div class="form-card">
        <h1>Create your account</h1>
        <p>Fill in the form to sign up.</p>

        <form id="signup-form" action="signup" method="post">
            <div class="form-row">
                <input type="text" id="username" name="username" placeholder="Username" required>
            </div>
            <div class="form-row">
                <input type="email" id="email" name="email" placeholder="Email" required>
            </div>
            <div class="form-row">
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>
            <div class="form-row">
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" required>
            </div>

            <button type="submit">Sign Up</button>
            <p class="feedback" id="feedback"></p>
        </form>

        <div class="link-row">
            <a class="primary-button" href="index.html">Back to Home</a>
        </div>
    </div>
</body>
</html>
